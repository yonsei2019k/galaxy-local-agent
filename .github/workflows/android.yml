name: Android checks and trusted release
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RELEASE_VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - name: Set monotonic version code
        run: printf 'RELEASE_VERSION_CODE=%s\n' "$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;29.0.14206865' 'cmake;3.22.1'
      - name: Compile and test
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :core:test :app:testDebugUnitTest :app:lintRelease :app:assembleRelease --no-daemon --console=plain
      - name: Upload unsigned artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unsigned-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 1
  sign-and-release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - name: Set monotonic version code
        run: printf 'RELEASE_VERSION_CODE=%s\n' "$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: unsigned-apk
          path: unsigned
      - name: Install signing dependencies
        run: |
          sdkmanager 'build-tools;37.0.0'
          python -m pip install --disable-pip-version-check -r scripts/ci-requirements.txt
      - name: Sign verified artifact and manifest
        shell: bash
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          APK_STORE_PASSWORD: ${{ secrets.APK_STORE_PASSWORD }}
          UPDATE_PRIVATE_KEY: ${{ secrets.UPDATE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$APK_KEYSTORE_BASE64" && test -n "$APK_STORE_PASSWORD" && test -n "$UPDATE_PRIVATE_KEY"
          umask 077
          mkdir -p release
          printf '%s' "$APK_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          "$ANDROID_HOME/build-tools/37.0.0/zipalign" -p -f 4 unsigned/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias localagent --ks-pass env:APK_STORE_PASSWORD --key-pass env:APK_STORE_PASSWORD --out "release/galaxy-local-agent-$RELEASE_VERSION_NAME.apk" "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose "release/galaxy-local-agent-$RELEASE_VERSION_NAME.apk"
          python scripts/release_manifest.py --apk "release/galaxy-local-agent-$RELEASE_VERSION_NAME.apk" --version-code "$RELEASE_VERSION_CODE" --version-name "$RELEASE_VERSION_NAME" --commit "$GITHUB_SHA" --tag "v$RELEASE_VERSION_NAME" --output release/update.json
          sha256sum "release/galaxy-local-agent-$RELEASE_VERSION_NAME.apk" > release/SHA256SUMS
      - name: Publish trusted release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'Automated tested build from commit %s. Device performance is verified separately on Galaxy S26.\n' "$GITHUB_SHA" > release/notes.txt
          gh release create "v$RELEASE_VERSION_NAME" "release/galaxy-local-agent-$RELEASE_VERSION_NAME.apk" release/update.json release/SHA256SUMS --title "Galaxy Local Agent $RELEASE_VERSION_NAME" --notes-file release/notes.txt --target "$GITHUB_SHA"

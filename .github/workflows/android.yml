name: Android checks and trusted release
on:
  pull_request:
  push:
    branches: [main, codex/internal-release]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      RELEASE_VERSION_NAME: 0.1.${{ github.run_number }}
      RUSTUP_TOOLCHAIN: 1.97.0
      CARGO_BUILD_JOBS: 2
      ZIPHAP_PYTHON: python
    steps:
      - name: Set monotonic version code
        # Above historical local1090; this workflow's run number remains monotonic.
        run: printf 'RELEASE_VERSION_CODE=%s\n' "$((2000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, official signed commit
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - name: Install pinned Rust and Android target
        shell: bash
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt --component clippy
          rustup target add --toolchain 1.97.0 aarch64-linux-android
      - name: Test Rust workspace and provider lifecycle
        shell: bash
        env:
          PYTHONPATH: pc-worker/deployed:pc-worker/eval
        run: |
          set -euo pipefail
          cargo test --manifest-path rust/Cargo.toml --workspace --locked --jobs 2
          python -m pip install --disable-pip-version-check -r scripts/ci-requirements.txt
          python -c 'import cryptography; assert cryptography.__version__ == "50.0.2"'
          python -m unittest discover -s pc-worker/tests -p 'test_*provider*.py'
          python -m unittest discover -s pc-worker/tests -p 'test_server_agent_adapter.py'
          python -m unittest discover -s pc-worker/tests -p 'test_private_image_workspace.py'
          ZIPHAP_COLLAB_BIN="$GITHUB_WORKSPACE/rust/target/debug/ziphap-collab" python -m unittest discover -s pc-worker/tests -p 'test_collab_bridge.py'
          python -m unittest discover -s pc-worker/eval -p 'test_*scenario*.py'
          python -m unittest discover -s pc-worker/eval -p 'test_problem_solving_eval.py'
          python -m unittest discover -s scripts/tests -p 'test_agent_scenario_attestation.py'
      - name: Test and bundle pinned offline React UI
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build-react-ui.py --self-test
          python scripts/build-react-ui.py --ci-tests
      - name: Install pinned Android SDK
        shell: bash
        run: |
          bash scripts/setup-android.sh 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;29.0.14206865' 'cmake;3.22.1'
      - name: Compile and test
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :core:test :app:testDebugUnitTest :app:lintRelease :app:assembleRelease :app:assembleDebugAndroidTest -Pkotlin.compiler.execution.strategy=in-process -x ':app:buildCMakeDebug[arm64-v8a]' --max-workers=2 --no-daemon --console=plain
      - name: Upload unsigned artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unsigned-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 1
      - name: Upload device-test artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: device-test-apk
          path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 1
  sign-and-release:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/internal-release')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - name: Set monotonic version code
        run: printf 'RELEASE_VERSION_CODE=%s\n' "$((2000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: unsigned-apk
          path: unsigned
      - name: Install signing dependencies
        run: |
          bash scripts/setup-android.sh 'build-tools;37.0.0'
          python -m pip install --disable-pip-version-check -r scripts/ci-requirements.txt
      - name: Sign verified artifact and manifest
        shell: bash
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          APK_STORE_PASSWORD: ${{ secrets.APK_STORE_PASSWORD }}
          UPDATE_PRIVATE_KEY: ${{ secrets.UPDATE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$APK_KEYSTORE_BASE64" && test -n "$APK_STORE_PASSWORD" && test -n "$UPDATE_PRIVATE_KEY"
          umask 077
          mkdir -p release
          printf '%s' "$APK_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          "$ANDROID_HOME/build-tools/37.0.0/zipalign" -P 16 -f 4 unsigned/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias localagent --ks-pass env:APK_STORE_PASSWORD --key-pass env:APK_STORE_PASSWORD --out "release/galaxy-local-agent-$RELEASE_VERSION_NAME.apk" "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose "release/galaxy-local-agent-$RELEASE_VERSION_NAME.apk"
          python scripts/release_manifest.py --apk "release/galaxy-local-agent-$RELEASE_VERSION_NAME.apk" --version-code "$RELEASE_VERSION_CODE" --version-name "$RELEASE_VERSION_NAME" --commit "$GITHUB_SHA" --tag "v$RELEASE_VERSION_NAME" --output release/update.json
          sha256sum "release/galaxy-local-agent-$RELEASE_VERSION_NAME.apk" > release/SHA256SUMS
      - name: Publish trusted release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'Automated tested build from commit %s. Device installation and workflows are verified separately.\n' "$GITHUB_SHA" > release/notes.txt
          gh release create "v$RELEASE_VERSION_NAME" "release/galaxy-local-agent-$RELEASE_VERSION_NAME.apk" release/update.json release/SHA256SUMS --title "ZipHap.Agent $RELEASE_VERSION_NAME" --notes-file release/notes.txt --target "$GITHUB_SHA" --latest
